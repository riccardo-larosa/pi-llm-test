<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>Shopping Cart</h1>

  <section id="products-section">
    <h2>Products</h2>
    <div id="products" class="product-list">Loading...</div>
  </section>

  <section id="cart-section">
    <h2>Cart</h2>
    <div id="cart">Loading...</div>
  </section>

  <script>
    async function fetchProducts() {
      const res = await fetch('/api/products');
      const data = await res.json();
      return data.products;
    }

    async function fetchCart() {
      const res = await fetch('/api/cart');
      const data = await res.json();
      return data.items;
    }

    async function addToCart(productId, quantity = 1) {
      await fetch('/api/cart/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ productId, quantity }),
      });
      await render();
    }

    async function updateQuantity(cartItemId, quantity) {
      await fetch(`/api/cart/items/${cartItemId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ quantity: parseInt(quantity, 10) }),
      });
      await render();
    }

    async function removeItem(cartItemId) {
      await fetch(`/api/cart/items/${cartItemId}`, { method: 'DELETE' });
      await render();
    }

    function formatPrice(cents) {
      return `$${(cents / 100).toFixed(2)}`;
    }

    async function renderProducts(products) {
      const container = document.getElementById('products');
      if (!products.length) {
        container.innerHTML = '<p class="empty">No products available.</p>';
        return;
      }
      container.innerHTML = products.map(p => `
        <div class="product-card">
          <h3>${escapeHtml(p.name)}</h3>
          <p class="price">${formatPrice(p.priceCents)}</p>
          <button data-testid="add-to-cart" onclick="addToCart('${p.id}', 1)">Add to Cart</button>
        </div>
      `).join('');
    }

    async function renderCart(items) {
      const container = document.getElementById('cart');
      if (!items.length) {
        container.innerHTML = '<p class="empty">Your cart is empty.</p>';
        return;
      }
      const totalCents = items.reduce((sum, i) => sum + i.priceCents * i.quantity, 0);
      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Price</th>
              <th>Qty</th>
              <th>Subtotal</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${items.map(i => `
              <tr>
                <td>${escapeHtml(i.name)}</td>
                <td>${formatPrice(i.priceCents)}</td>
                <td>
                  <input type="number" min="1" value="${i.quantity}"
                    onchange="updateQuantity('${i.id}', this.value)">
                </td>
                <td>${formatPrice(i.priceCents * i.quantity)}</td>
                <td>
                  <button class="remove" data-testid="remove-item" onclick="removeItem('${i.id}')">Remove</button>
                </td>
              </tr>
            `).join('')}
            <tr class="total-row">
              <td colspan="3">Total</td>
              <td colspan="2">${formatPrice(totalCents)}</td>
            </tr>
          </tbody>
        </table>
      `;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function render() {
      const [products, items] = await Promise.all([fetchProducts(), fetchCart()]);
      await renderProducts(products);
      await renderCart(items);
    }

    window.addToCart = addToCart;
    window.updateQuantity = updateQuantity;
    window.removeItem = removeItem;

    render();
  </script>
</body>
</html>
